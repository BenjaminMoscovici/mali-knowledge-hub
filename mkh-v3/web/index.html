<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Mali Knowledge Hub V3</title>
  <link rel="stylesheet" href="/assets/styles.css?v=4">
  <script src="/assets/outputs.js?v=3" defer></script>
  <script src="/assets/app.js?v=6" defer></script>
  <script src="/assets/admin.js?v=1" defer></script>
</head>
<body>
  <div class="workspace" id="workspace">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="sidebar-top">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">M</div>
          <span class="brand-name">Mali Knowledge Hub</span>
          <button class="icon-button sidebar-collapse" id="sidebar-collapse" aria-label="Collapse sidebar" title="Collapse sidebar">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
          </button>
        </div>
        <button class="nav-action new-chat" id="new-chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span></button>
        <button class="nav-action" type="button" id="sources-toggle"><svg viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4zM13 7a3 3 0 0 1 3-3h4v15h-3a4 4 0 0 0-4 2"/></svg><span>What the Hub knows</span></button>
      </div>
      <div class="history-scroll">
        <div class="history-label" id="history-label">Recent</div>
        <div id="thread-list" class="thread-list"></div>
      </div>
      <div class="sidebar-bottom">
        <button type="button" id="source-review" class="sources-button hidden">Source review</button>
        <button type="button" id="personal-memory" class="sources-button hidden">Personal memory</button>
        <button type="button" class="profile" id="profile-button"><span class="avatar" aria-hidden="true">M</span><span class="profile-text"><strong id="profile-title">Sign in</strong><small>V3 development preview</small></span></button>
      </div>
    </aside>

    <div class="sidebar-scrim hidden" id="sidebar-scrim"></div>
    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-button sidebar-open" id="sidebar-open" aria-label="Open sidebar" title="Open sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
        <span class="topbar-title" id="topbar-title">Mali Knowledge Hub</span>
        <button type="button" class="sources-button" id="working-notes">Working instructions</button>
      </header>

      <div class="conversation-scroll" id="conversation-scroll">
        <div class="conversation-column" id="conversation-column">
          <div class="welcome" id="welcome">
            <div class="welcome-symbol" aria-hidden="true">M</div>
            <h1>What would you like to explore?</h1>
            <p>Research Mali with evidence you can inspect.</p>
            <div class="suggestions" aria-label="Example questions">
              <button class="suggestion">Prépare une note sur la sécurité alimentaire dans la zone de Mopti.</button>
              <button class="suggestion">Compare reported funding with requirements for a humanitarian plan.</button>
              <button class="suggestion">What can independent evaluations tell us about the results of development projects?</button>
            </div>
          </div>
          <button type="button" class="sources-button hidden" id="earlier-turns">Load earlier messages</button>
          <div id="messages" class="messages" aria-live="polite"></div>
          <div id="conversation-end"></div>
        </div>
      </div>

      <div class="composer-dock">
        <div class="composer-shell">
          <form class="composer" id="composer">
            <label class="sr-only" for="prompt">Ask a question about Mali</label>
            <textarea id="prompt" rows="1" maxlength="5000" placeholder="Ask a question about Mali…"></textarea>
            <div class="composer-toolbar">
              <div class="composer-left">
                <button type="button" class="sources-button hidden" id="composer-sign-in">Sign in to save chats</button>
                <span class="composer-hint" id="composer-hint">Evidence-grounded research</span>
              </div>
              <div class="composer-right">
                <button type="button" class="sources-button hidden" id="cancel-button">Stop</button>
                <label class="sr-only" for="analysis-mode">Analysis depth</label>
                <select id="analysis-mode" title="Analysis depth"><option value="fast" selected>Fast</option><option value="deep">Deep</option></select>
                <button type="submit" class="send-button" id="send-button" aria-label="Send question" title="Send question" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
              </div>
            </div>
          </form>
          <div class="composer-caption"><span id="preview-status" role="status">Connecting to the V3 preview…</span></div>
        </div>
      </div>
    </main>

    <div class="drawer-scrim hidden" id="drawer-scrim"></div>
    <aside class="evidence-drawer hidden" id="evidence-drawer" aria-label="Sources and evidence">
      <div class="drawer-head"><div><small>RESEARCH EVIDENCE</small><h2>Sources</h2></div><button class="icon-button" id="drawer-close" aria-label="Close sources"><svg viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></svg></button></div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>
  </div>


  <dialog class="auth-dialog" id="auth-dialog" aria-labelledby="auth-title">
    <form method="dialog">
      <button class="icon-button modal-close" aria-label="Close sign-in">×</button>
    </form>
    <div class="modal-mark" aria-hidden="true">M</div>
    <h2 id="auth-title">Sign in to V3</h2>
    <p id="auth-description">Sign in to save and reopen your V3 conversations.</p>
    <div class="modal-status hidden" id="auth-status" role="status"></div>
    <form id="auth-form">
      <div id="auth-email-wrap">
        <label for="auth-email">Email address</label>
        <input id="auth-email" type="email" autocomplete="email" required maxlength="254">
      </div>
      <div id="auth-password-wrap">
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" required maxlength="256">
      </div>
      <div class="hidden" id="auth-confirm-wrap">
        <label for="auth-confirm">Confirm password</label>
        <input id="auth-confirm" type="password" autocomplete="new-password" maxlength="256">
      </div>
      <button class="primary-button" id="auth-submit" type="submit">Sign in</button>
    </form>
    <div class="auth-links">
      <button type="button" id="auth-login" class="hidden">Back to sign in</button>
      <button type="button" id="auth-signup">Create account</button>
      <button type="button" id="auth-recover">Forgot password</button>
    </div>
  </dialog>
</body>
</html>
