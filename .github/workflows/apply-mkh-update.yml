name: Apply MKH V4 source update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v4-frontend-rewrite
      - name: Apply source archive
        run: |
          tar -xzf mkh-v4-source.tar.gz
          rm mkh-v4-source.tar.gz
          rm .github/workflows/apply-mkh-update.yml
      - name: Commit reconciled source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add versioned MKH V1-V4 platform and source integration"
          git push origin HEAD:v4-frontend-rewrite
