name: MKH evaluation integrity
on:
  pull_request:
    paths: ['evaluation/**', '.github/workflows/mkh-evaluation.yml']
  workflow_dispatch:
jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s evaluation/tests -v
      - run: python -c 'from evaluation.common import verify_freeze; verify_freeze()'
